# Example virtual host. Attach TLS certificates or place behind your HTTPS ingress.
# Deploy frontend/dist to /var/www/menu-maestro before enabling this configuration.
server {
    listen 80;
    server_name menu.example.com;
    root /var/www/menu-maestro;
    index index.html;
    client_max_body_size 15m;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
